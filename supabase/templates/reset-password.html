<div style="margin:0;padding:32px 16px;background:#111412;color:#f2f0e9;font-family:Arial,sans-serif;">
  <div style="max-width:480px;margin:0 auto;padding:32px;border:1px solid #303630;border-radius:4px;background:#191d1a;">
    <p style="margin:0 0 12px;color:#9ca39b;font-size:11px;font-weight:700;letter-spacing:1.6px;text-transform:uppercase;">Replay Lab</p>
    <h2 style="margin:0 0 14px;color:#f2f0e9;font-size:26px;line-height:1.2;">Reset your password</h2>
    <p style="margin:0 0 22px;color:#b4bab3;font-size:15px;line-height:1.6;">Enter this six-digit code in Replay Lab to choose a new password.</p>
    <div style="padding:18px 12px;border:1px solid #454c45;border-radius:3px;background:#0b0e0c;color:#f2f0e9;font-family:monospace;font-size:30px;font-weight:700;letter-spacing:7px;text-align:center;">{{ .Token }}</div>
    <p style="margin:20px 0 0;color:#9ca39b;font-size:12px;line-height:1.5;">This code expires soon. If you did not request a password reset, do not share this code and you can safely ignore this email.</p>
  </div>
</div>
